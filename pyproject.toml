[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "railops-data-platform"
version = "0.1.0"
description = "A production-minded batch data engineering learning project"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pytz>=2025.2",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
railops = "railops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/railops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

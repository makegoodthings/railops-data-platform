services:
  source-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SOURCE_DB_NAME:-railops}
      POSTGRES_USER: ${SOURCE_DB_USER:-railops}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:-railops_local_only}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - source_data:/var/lib/postgresql/data

  pipeline:
    build: .
    env_file:
      - .env
    depends_on:
      source-db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  airflow:
    image: apache/airflow:3.3.2-python3.12
    profiles: ["orchestration"]
    command: standalone
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project/src
      SOURCE_DB_HOST: source-db
      SOURCE_DB_PORT: 5432
      SOURCE_DB_NAME: ${SOURCE_DB_NAME:-railops}
      SOURCE_DB_USER: ${SOURCE_DB_USER:-railops}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:-railops_local_only}
      WAREHOUSE_PATH: /opt/airflow/project/data/warehouse.duckdb
    depends_on:
      source-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/.airflow:/opt/airflow

volumes:
  source_data:

